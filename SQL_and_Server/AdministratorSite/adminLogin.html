<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="main.css">
        <link rel="icon" type="image/x-icon" href="SJfavicon.ico">
        <script src="admin.js"></script>
        <title>Login</title>
    </head>
    <body>
        <div id="adminLoginPage">
            <form id="adminLogin">
                <p>Login</p>
                <input type="text" name="loginID" id="login" class="loginC inputs" placeholder="Username/Email" oninput="noErrors()" required>
                <input type="password" name="pwd" id="password" class="loginC inputs" placeholder="Password" oninput="noErrors()" onchange="loginCheck()" required>
                <input type="hidden" name="admin" value="1">
                <p id="error_message" style="display: none; color: red;"></p>
                <input type="submit" value="Login" class="loginC" onclick="adminSendLogin(event)">
            </form>
            <button class="loginC" onclick="event.preventDefault()"><a href="http://localhost:10000/adminSignUp">Sign Up</a></button>
        </div>
        
    </body>
    
</html>
